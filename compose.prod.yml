# Production-like stack: Postgres + pgvector, backend (prod profile), Caddy serving the SPA and proxying /api.
#   cp .env.example .env   # fill GUEST_TOKEN_SECRET, DB_PASSWORD and the key of AI_PROVIDER (Gemini or OpenAI)
#   docker compose -f compose.prod.yml up -d --build
# First start seeds the catalog and embeds the knowledge base once (about 1 minute). Open http://localhost
# Own project name, so its volume never mixes with the dev database of docker-compose.yml (different password).
name: travelpilot-prod

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: travelpilot
      POSTGRES_USER: tp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tp -d travelpilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  be:
    build:
      context: .
      dockerfile: be/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/travelpilot
      DB_USER: tp
      DB_PASSWORD: ${DB_PASSWORD}
      # AI provider (see .env.example): only the chosen provider's key is needed, the app refuses to start without it.
      AI_PROVIDER: ${AI_PROVIDER:-google-genai}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-${AI_PROVIDER:-google-genai}}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${AI_API_KEY:-}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      GUEST_TOKEN_SECRET: ${GUEST_TOKEN_SECRET:?set GUEST_TOKEN_SECRET (32+ chars) in .env}
      WEATHER_ENABLED: ${WEATHER_ENABLED:-true}
      TRAVELPILOT_INGEST_AUTO: "true"
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./fe
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - be
    restart: unless-stopped

volumes:
  pgdata: {}
  caddy_data: {}
