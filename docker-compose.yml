services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: travelpilot
      POSTGRES_USER: tp
      POSTGRES_PASSWORD: tp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tp -d travelpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata: {}
