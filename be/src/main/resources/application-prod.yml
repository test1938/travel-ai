# Production: every secret comes from the environment, no defaults for credentials.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

logging:
  structured:
    format:
      console: ecs                      # one JSON object per line; MDC (requestId) becomes a field

management:
  endpoints:
    web:
      exposure:
        include: health
